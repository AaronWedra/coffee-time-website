<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" role="img" aria-label="A cup of coffee on a saucer, seen from above">
  <defs>
    <radialGradient id="saucer" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".62" stop-color="#f4f1ec"/><stop offset=".86" stop-color="#dcd6cd"/><stop offset="1" stop-color="#c3bbb0"/>
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="50%" r="50%">
      <stop offset=".72" stop-color="#e9e4dc" stop-opacity="0"/><stop offset=".9" stop-color="#b9b0a4" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#eeeae4"/><stop offset="1" stop-color="#bdb5a9"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f877b"/><stop offset=".45" stop-color="#d9d3ca"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="crema" cx="46%" cy="44%" r="56%">
      <stop offset="0" stop-color="#d9a868"/><stop offset=".38" stop-color="#c08a4c"/><stop offset=".7" stop-color="#9a6230"/><stop offset=".92" stop-color="#6d3d17"/><stop offset="1" stop-color="#4a260c"/>
    </radialGradient>
    <radialGradient id="foam" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6e7cb" stop-opacity=".95"/><stop offset=".6" stop-color="#ecd3a6" stop-opacity=".7"/><stop offset="1" stop-color="#e2c08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e6e1d9"/><stop offset="1" stop-color="#b3ab9f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="cup"><circle cx="232" cy="226" r="106"/></clipPath>
  </defs>

  <!-- shadow of the whole thing on the table, light from the top left -->
  <ellipse cx="262" cy="268" rx="206" ry="196" fill="#0a001e" opacity=".5" filter="url(#soft)"/>

  <!-- saucer -->
  <circle cx="240" cy="236" r="200" fill="url(#saucer)"/>
  <circle cx="240" cy="236" r="200" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
  <circle cx="240" cy="236" r="150" fill="url(#well)"/>

  <!-- shadow the cup drops on the saucer -->
  <ellipse cx="256" cy="252" rx="128" ry="124" fill="#3b2a1c" opacity=".38" filter="url(#blur4)"/>

  <!-- handle, pointing down right -->
  <g transform="rotate(38 232 226)">
    <path d="M338 204 h58 a22 22 0 0 1 22 22 a22 22 0 0 1 -22 22 h-58 z" fill="url(#handle)"/>
    <path d="M344 215 h48 a11 11 0 0 1 11 11 a11 11 0 0 1 -11 11 h-48 z" fill="#cfc8bd" opacity=".55"/>
    <path d="M340 206 h56 a20 20 0 0 1 14 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- cup: rim, inner wall, coffee -->
  <circle cx="232" cy="226" r="124" fill="url(#rim)"/>
  <circle cx="232" cy="226" r="114" fill="url(#wall)"/>
  <circle cx="232" cy="226" r="106" fill="url(#crema)"/>
  <g clip-path="url(#cup)">
    <!-- the wall's shadow falling on the coffee, top left -->
    <circle cx="232" cy="226" r="112" fill="none" stroke="#2a1205" stroke-width="22" opacity=".42" filter="url(#blur4)" transform="translate(-9 -9)"/>
    <!-- a soft island of foam, a little off centre, with a crema swirl through it -->
    <ellipse cx="240" cy="234" rx="70" ry="62" fill="url(#foam)"/>
    <path d="M196 236 c18 -34 62 -40 82 -14 c14 20 -4 44 -28 42 c-18 -2 -24 -20 -12 -30" fill="none" stroke="#b07a40" stroke-width="7" stroke-linecap="round" opacity=".38" filter="url(#blur2)"/>
    <path d="M186 212 c30 -30 84 -26 104 6" fill="none" stroke="#fff3da" stroke-width="5" stroke-linecap="round" opacity=".45" filter="url(#blur2)"/>
    <!-- bubbles gathered at the edge of the foam -->
    <g fill="#fff8ea" stroke="#8a5a2c" stroke-width=".8" opacity=".85">
      <circle cx="292" cy="262" r="3.2"/><circle cx="299" cy="254" r="2"/><circle cx="286" cy="270" r="2.2"/><circle cx="296" cy="268" r="1.4"/>
      <circle cx="182" cy="250" r="2.6"/><circle cx="176" cy="242" r="1.6"/><circle cx="188" cy="258" r="1.5"/>
      <circle cx="246" cy="296" r="2.4"/><circle cx="254" cy="300" r="1.5"/><circle cx="238" cy="300" r="1.3"/>
      <circle cx="270" cy="176" r="1.8"/><circle cx="277" cy="181" r="1.2"/>
    </g>
    <!-- light catching the surface -->
    <ellipse cx="198" cy="190" rx="34" ry="12" fill="#fff" opacity=".22" filter="url(#blur4)" transform="rotate(-38 198 190)"/>
  </g>
  <!-- rim highlights -->
  <path d="M132 170 a124 124 0 0 1 150 -58" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".95"/>
  <path d="M330 300 a124 124 0 0 1 -60 46" fill="none" stroke="#9a9186" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  <circle cx="232" cy="226" r="106" fill="none" stroke="#3a1c08" stroke-opacity=".35" stroke-width="1.5"/>

</svg>
